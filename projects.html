<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/responsive.css" />

    <title>Project</title>
  </head>
  <body>
    <!--? Start Splach Screen Container -->

    <div class="mobile-overlay"></div>

    <!--? End Splach Screen Container -->

    <!--? Start Aside Container -->

    <aside id="sidebar"></aside>

    <!--? End Aside Container -->

    <!--? Start Header -->

    <header id="header"></header>

    <!--? End Header -->
    <div class="page project">
      <div class="page-heading">
        <div>
          <p>WORKSPACE</p>

          <h2 class="user-name">Project</h2>

          <h3>Create, organize, and track everything you're building.</h3>
        </div>
        <button class="new-project">
          <i class="fa-solid fa-plus"></i>

          New Project
        </button>
      </div>

      <!--? Project Filter Banner -->

      <div class="toolbar">
        <div class="search-box">
          <input type="text" placeholder="Search projects..." />
        </div>

        <button class="active" data-filter="All">All projects</button>
        <button data-filter="Progress">In progress</button>
        <button data-filter="Completed">Completed</button>
      </div>
      <div class="cards"></div>
    </div>
    <script src="./js/sidebar.js"></script>
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/project.js"></script>
  </body>
</html>
