<div class="btn-overlay"></div>
<div class="project-list">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-icon state-icon">
        <i class="fa-regular fa-folder"></i>
      </div>
      <div>
        <h2>New Project</h2>
        <p>Add the details below to get started.</p>
      </div>
      <button class="closebtn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <label
        >Project title<input
          class="project-name"
          placeholder="Enter project title"
          type="text" /></label
      ><label
        >Description<textarea
          class="project-des"
          placeholder="Add description..."
        ></textarea></label
      ><label>
        Project
        <select class="project-category">
          <option value="" selected disabled>Select project</option>
          <option>Web App</option>
          <option>Design</option>
          <option>Education</option>
          <option>Backend</option>
          <option>Other</option>
        </select>
      </label>
      <label class="Extent-of-importance">
        <select class="importance">
          <option disabled selected>select Extent of importance</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select></label
      ><label>Deadline<input placeholder="Enter deadline" type="date" /></label>
      <div class="color-row">
        <button data-color="purple" class="active" title="Purple"></button>
        <button data-color="red" title="Red"></button>
        <button data-color="green" title="Green"></button>
        <button data-color="orange" title="Orange"></button>
        <button data-color="blue" title="Blue"></button>
      </div>
    </div>

    <div class="modal-foot">
      <button class="cancel btn">Cancel</button
      ><button class="create create-project btn">Create Project</button>
    </div>
  </div>
</div>
