<div class="btn-overlay"></div>
<div class="add-list">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-icon state-icon">
        <i class="fa-solid fa-check"></i>
      </div>
      <div>
        <h2>New task</h2>
        <p>Add the details below to get started.</p>
      </div>
      <button class="closebtn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <label
        >Task title<input
          class="task-name"
          placeholder="Enter task title"
          type="text"
      /></label>
      <label
        >Description<textarea
          class="task-des"
          placeholder="Add description..."
        ></textarea>
      </label>
      <label>
        Project

        <select class="task-project">
          <option value="" selected disabled>Select project</option>
          <option value="other">Other</option>
        </select>
      </label>

      <label class="Extent-of-importance">
        <select class="importance">
          <option disabled selected>select Extent of importance</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select></label
      ><label>Deadline<input placeholder="Enter deadline" type="date" /></label>
    </div>
    <div class="modal-foot">
      <button class="cancel btn">Cancel</button
      ><button class="create create-task btn">Create task</button>
    </div>
  </div>
</div>
