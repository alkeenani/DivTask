<div class="section-name">
  <button class="btns bar">
    <i class="fa-solid fa-bars"></i>
  </button>
  <div class="brand">
    <h2>Dashboard</h2>
    <p class="date">Monday, December 15</p>
  </div>
</div>

<div class="header-actions">
  <!-- Search -->

  <div class="search-box">
    <input type="text" placeholder="Search..." />
  </div>

  <!-- Dark Mode -->

  <button class="dark-mode btns">
    <i class="fa-solid fa-moon"></i>
  </button>

  <!-- Notifications -->

  <button class="notifications-btn btns">
    <i class="fa-regular fa-bell"></i>
  </button>
  <div class="notifications-list card">
    <div class="heading icons">
      <p>Notifications</p>
      <button class="mark-as-read">Mark as Read</button>
    </div>
    <div class="reslut empty">
      <div class="icon">
        <i class="fa-solid fa-box-open"></i>
      </div>
      <h2>Empty</h2>
    </div>
  </div>

  <!-- User -->

  <div class="header-user">
    <div class="imge-profile">MA</div>

    <div class="name">
      <h2 class="header-profile-name">Mohamed Alkenani</h2>
      <small class="header-profile-role">Developer</small>
    </div>
  </div>
</div>
