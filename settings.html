<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/responsive.css" />

    <title>settings</title>
  </head>
  <body>
    <!--? Start Splach Screen Container -->

    <div class="mobile-ovrelay"></div>

    <!--? End Splach Screen Container -->

    <!--? Start Aside Container -->

    <aside id="sidebar"></aside>

    <!--? End Aside Container -->

    <!--? Start Header -->

    <header id="header"></header>

    <!--? End Header -->
    <div class="page settings-section">
      <div class="page-heading">
        <div>
          <p>PREFERENCES</p>

          <h2 class="user-name">Settings</h2>

          <h3>Manage your profile and personalize your DevTask experience.</h3>
        </div>
      </div>
      <div class="settings-layout">
        <div class="card">
          <div class="profile-edit">
            <div class="imge-profile">MA</div>
            <div class="instructs">
              <button class="change-photo">Change Photo</button>

              <!--? Hidden Input - The Button Above Opens It -->

              <input type="file" id="photo" accept="image/*" hidden />

              <p>JPG, GIF or PNG. Max 2MB</p>
            </div>
          </div>
          <div class="form-grid">
            <label for="first-name"
              >First Name
              <input
                type="text"
                id="first-name"
                placeholder="Enter First Name"
                autocomplete="given-name"
              />
            </label>
            <label for="last-name"
              >Last Name
              <input
                type="text"
                id="last-name"
                placeholder="Enter Last Name"
                autocomplete="family-name"
              />
            </label>
            <label for="role"
              >Role
              <input
                type="text"
                id="role"
                placeholder="Enter Role"
                autocomplete="organization-title"
              />
            </label>
            <label for="email"
              >Email
              <input
                type="email"
                id="email"
                placeholder="Enter Your Gmail"
                autocomplete="email"
              />
            </label>

            <label for="bio" class="full"
              >Bio
              <textarea
                id="bio"
                placeholder="Tell something about yourself"
              ></textarea>
            </label>
          </div>

          <!--? Validation / Confirmation Message -->

          <div class="settings-actions">
            <button class="reset-profile">Reset</button
            ><button class="save-profile">Save changes</button>
          </div>
        </div>
        <div class="card settings-data">
          <div class="heading-card">
            <div>
              <h3>Saved data</h3>

              <p>DevTask has no server. Everything lives in this browser.</p>
            </div>
          </div>
          <div class="data-rows">
            <div><span>Tasks</span><b class="count-tasks">0</b></div>
            <div><span>Projects</span><b class="count-projects">0</b></div>
            <div><span>Notes</span><b class="count-notes">0</b></div>
            <div><span>Storage used</span><b class="count-size">0 B</b></div>
          </div>
        </div>
      </div>
    </div>
    <script src="./js/sidebar.js"></script>
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/settings.js"></script>
  </body>
</html>
