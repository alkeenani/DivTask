<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/responsive.css" />

    <title>Note</title>
  </head>
  <body>
    <!--? Start Splach Screen Container -->

    <div class="mobile-overlay"></div>

    <!--? End Splach Screen Container -->

    <!--? Start Aside Container -->

    <aside id="sidebar"></aside>

    <!--? End Aside Container -->

    <!--? Start Header -->

    <header id="header"></header>

    <!--? End Header -->
    <div class="page note-section">
      <div class="page-heading">
        <div>
          <p>IDEAS</p>

          <h2 class="user-name">Notes</h2>

          <h3>Capture ideas, references, and everything worth remembering.</h3>
        </div>
        <button class="new-note">
          <i class="fa-solid fa-plus"></i>

          New note
        </button>
      </div>
      <div class="note-summary">
        <div class="card total">
          <div class="stat-icon purple">
            <i class="fa-solid fa-note-sticky"></i>
          </div>
          <div class="info">
            <h3 class="count">0</h3>
            <p>Total notes</p>
          </div>
        </div>
        <div class="card important">
          <div class="stat-icon orange">
            <i class="fa-solid fa-star"></i>
          </div>
          <div class="info">
            <h3 class="count">0</h3>
            <p>Important</p>
          </div>
        </div>
        <div class="card normal">
          <div class="stat-icon green">
            <i class="fa-regular fa-star"></i>
          </div>
          <div class="info">
            <h3 class="count">0</h3>
            <p>Normal</p>
          </div>
        </div>
      </div>

      <div class="search-box">
        <input type="text" placeholder="search" />
      </div>
      <!--? Filled By js/notes.js From The Saved Notes -->

      <div class="note-cards">
        <div class="card note important">
          <div>
            <span class="badge type">DivTask</span>
            <div class="add-del">
              <i class="fa-regular fa-pen-to-square edit-btn"></i>
              <i class="fa-regular fa-trash-can del-btn"></i>
            </div>
          </div>
          <b class="note-name">Tasks1</b>
          <p class="note-description">This Frist TASK in DivTask Project</p>
          <span class="note-date">
            <i class="fa-regular fa-calendar-days"></i>
            Today
          </span>
        </div>
      </div>
    </div>
    <script src="./js/sidebar.js"></script>
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/notes.js"></script>
  </body>
</html>
