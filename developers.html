<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--? Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <title>Document</title>
  </head>
  <body>
    <!--? Start SideBar Container  -->
    <aside id="sidebar"></aside>
    <!--? End SideBar Container  -->

    <!--? Start Header Container  -->
    <header id="header"></header>
    <!--? End Header Container  -->
    <!--? Start Dev Page  -->
    <div class="page developer">
      <!--? Start GitHub Hero  -->
      <div class="github-hero">
        <div class="icon"><i class="fa-brands fa-github"></i></div>
        <p>DEVELOPER DISCOVER</p>
        <h1>Find GitHub developers</h1>
        <h3>
          Search by username to explore profiles, stats, and public
          repositories.
        </h3>
        <!--? Start Tolbar Search  -->
        <div class="tolbar">
          <div class="search-box">
            <input type="text" placeholder="search" class="repo-user" />
          </div>
          <button class="searchBtn">Search GitHub</button>
        </div>
        <!--? End Tolbar Search  -->
      </div>
      <!--? End GitHub Hero  -->
      <div class="result-search">
        <div class="empty-result">
          <div>
            <i class="fas fa-search"></i>
          </div>
          <h2>Start Your Search</h2>
          <p>
            Search by username to explore profiles, stats, and public
            repositories.
          </p>
        </div>
      </div>
    </div>
    <!--? End Dev Page  -->
    <script src="./js/sidebar.js"></script>

    <script src="./js/main.js"></script>
  </body>
</html>
