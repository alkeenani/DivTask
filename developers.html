<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/responsive.css" />

    <title>Develpers</title>
  </head>
  <body>
    <!--? Start Splach Screen Container -->

    <div class="mobile-overlay"></div>

    <!--? End Splach Screen Container -->

    <!--? Start Aside Container -->

    <aside id="sidebar"></aside>

    <!--? End Aside Container -->

    <!--? Start Header -->

    <header id="header"></header>

    <!--? End Header -->
    <div class="page developers">
      <div class="github-hero">
        <div class="icon"><i class="fa-brands fa-github"></i></div>
        <p>DEVELOPER DISCOVERY</p>
        <h1>Find GitHub developers</h1>
        <h3>
          Search by username to explore profiles, stats, and public
          repositories.
        </h3>
        <div class="tolbar">
          <div class="search-box">
            <input type="text" placeholder="search" class="repo-user" />
          </div>
          <button class="searchBtn">Search GitHub</button>
        </div>
      </div>
      <div class="result-search">
        <div class="empty-result">
          <div>
            <i class="fas fa-search"></i>
          </div>
          <h2>Start your search</h2>
          <p>
            Enter a GitHub username above to discover a developer and their
            work.
          </p>
        </div>
      </div>
    </div>
    <script src="./js/sidebar.js"></script>
    <script type="module" src="./js/main.js"></script>
    <script src="./js/developers.js"></script>
  </body>
</html>
