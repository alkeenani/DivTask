<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/responsive.css" />

    <title>Task</title>
  </head>
  <body>
    <!--? Start Splach Screen Container -->

    <div class="mobile-overlay"></div>

    <!--? End Splach Screen Container -->

    <!--? Start Aside Container -->

    <aside id="sidebar"></aside>

    <!--? End Aside Container -->

    <!--? Start Header -->

    <header id="header"></header>

    <!--? End Header -->
    <!--? Start Task  Container -->
    <div class="page task-section">
      <div class="page-heading">
        <div>
          <p>FOCUS</p>

          <h2 class="user-name">My Tasks</h2>

          <h3>Prioritize your work and make every day count.</h3>
        </div>
        <button class="add-task">
          <i class="fa-solid fa-plus"></i>

          Add Task
        </button>
      </div>
      <div class="task-summary total">
        <div class="card">
          <div class="stat-icon purple">
            <i class="fa-solid fa-check"></i>
          </div>
          <div class="info total">
            <h3 class="count">0</h3>
            <p>Total Task</p>
          </div>
        </div>
        <div class="card in-progress">
          <div class="stat-icon blue">
            <i class="fa-regular fa-clock"></i>
          </div>
          <div class="info">
            <h3 class="count">0</h3>
            <p>In progress</p>
          </div>
        </div>
        <div class="card completed">
          <div class="stat-icon green">
            <i class="fa-solid fa-border-all"></i>
          </div>
          <div class="info">
            <h3 class="count">0</h3>
            <p>Completed</p>
          </div>
        </div>
        <div class="card">
          <div class="stat-icon orange">
            <i class="fa-regular fa-flag"></i>
          </div>
          <div class="info">
            <h3 class="count">0</h3>
            <p>Due soon</p>
          </div>
        </div>
      </div>
      <div class="project-filter-banner" id="projectFilterBanner" hidden>
        <span id="currentProjectName"></span>
        <button type="button" id="showAllTasks" class="show-all-tasks">
          Show all tasks
        </button>
      </div>
      <div class="task-table">
        <div class="toolbar">
          <div class="search-box">
            <input type="text" placeholder="search" />
          </div>

          <div class="filter-tasks">
            <button class="active" data-category="All">All Tasks</button>
            <button data-category="In-Progress">In Progress</button>
            <button data-category="In-Completed">Completed</button>
            <button data-category="In-Todo">To Do</button>
            <button data-category="In-Overdue">Overdue</button>
          </div>
        </div>
        <div class="table-rows">
          <div class="table-head">
            <div>Task</div>
            <div>Project</div>
            <div>Priority</div>
            <div>Status</div>
            <div>Due Date</div>
          </div>
          <div class="table-body">
            <div class="All In-Completed">
              <b>
                <input type="checkbox" checked="" id="1791657471995" />
                <span>asdASF</span>
              </b>

              <span class="task-project-name">Other</span>

              <span class="badge High">High</span>

              <span class="badge state-in-Completed"> Completed </span>

              <span class="due-day current">
                <i class="fa-solid fa-clock"></i>
                2026-10-11
              </span>

              <div class="item-actions">
                <summary>
                  <i class="fa-solid fa-ellipsis"></i>
                </summary>

                <div>
                  <button type="button" class="edit-btn">
                    <i class="fa-regular fa-pen-to-square"></i>
                    Edit
                  </button>

                  <button type="button" class="delete-btn">
                    <i class="fa-regular fa-trash-can"></i>
                    Delete
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!--? End Task  Container -->
    <script type="module" src="./js/sidebar.js"></script>
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/tasks.js"></script>
  </body>
</html>
